name: Export YOLO to CoreML

on:
  workflow_dispatch:
    inputs:
      model_filename:
        description: 'Model filename (uploaded as artifact)'
        required: true
        default: 'best.pt'

jobs:
  export:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ultralytics coremltools

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: dart-model
          path: .
        continue-on-error: true

      - name: Export to CoreML
        run: |
          python - <<'EOF'
          from ultralytics import YOLO
          import os

          model_path = 'best.pt'
          if not os.path.exists(model_path):
              print("Model niet gevonden!")
              exit(1)

          print("Model laden...")
          model = YOLO(model_path)

          print("Exporteren naar CoreML...")
          model.export(
              format='coreml',
              imgsz=640,
              nms=True,
          )
          print("CoreML export klaar!")
          EOF

      - name: Upload CoreML model
        uses: actions/upload-artifact@v4
        with:
          name: dart-model-coreml
          path: '*.mlpackage'
          if-no-files-found: error
