name: Export YOLO to CoreML

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ultralytics coremltools torch torchvision

      - name: Check model exists
        run: |
          ls -la *.pt || echo "No .pt files found"

      - name: Export to CoreML
        run: |
          python - <<'EOF'
          from ultralytics import YOLO
          import os
          import glob

          # Zoek het model bestand
          pt_files = glob.glob('*.pt')
          if not pt_files:
              print("FOUT: Geen .pt bestand gevonden!")
              exit(1)

          model_path = pt_files[0]
          print(f"Model gevonden: {model_path}")

          model = YOLO(model_path)

          print("Exporteren naar CoreML...")
          result = model.export(
              format='coreml',
              imgsz=640,
              nms=True,
          )
          print(f"CoreML export klaar: {result}")
          EOF

      - name: List exported files
        run: |
          ls -la
          find . -name "*.mlpackage" -o -name "*.mlmodel" 2>/dev/null

      - name: Upload CoreML model
        uses: actions/upload-artifact@v4
        with:
          name: dart-model-coreml
          path: |
            *.mlpackage
            *.mlmodel
          if-no-files-found: error
